name: Release Helm Chart

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-chart:
    name: Release chart to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read chart version
        id: chart
        run: |
          version="$(awk '/^version:/ {print $2; exit}' charts/mackerel-operator/Chart.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilding an already released tag would change its digest on every push to
      # main, so only build when the chart version introduces a new tag.
      - name: Check whether the image tag already exists
        id: image
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tag="ghcr.io/slashnephy/mackerel-operator:${CHART_VERSION}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: rebuilding $tag"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$tag" > /dev/null 2>&1; then
            echo "$tag already exists, skipping the build to keep its digest stable"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$tag does not exist yet, building it"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        if: steps.image.outputs.exists != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/slashnephy/mackerel-operator
          tags: |
            type=raw,value=${{ steps.chart.outputs.version }}
            type=raw,value=latest

      - name: Build and push controller image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.image.outputs.exists != 'true'
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Update Pages home on gh-pages
        run: |
          git fetch origin gh-pages
          workdir="$(mktemp -d)"
          git worktree add "$workdir" origin/gh-pages
          cp README.md "$workdir/index.md"
          cd "$workdir"
          git add index.md
          if git diff --cached --quiet; then
            echo "No Pages home changes to commit"
            exit 0
          fi
          git commit -m "docs: update Pages home"
          git push origin HEAD:gh-pages

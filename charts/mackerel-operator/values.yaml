replicaCount: 1

image:
  repository: ghcr.io/slashnephy/mackerel-operator
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion. This image is built by this repository itself,
  # so it is excluded from Renovate updates (see renovate.json).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

mackerel:
  apiKeySecret:
    name: mackerel-api-key
    key: apiKey

leaderElection:
  enabled: true

policy: upsert-only
ownerID: default
hashLength: 7

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Injects mackerel-container-agent as a native sidecar into Pods labelled
# agent.mackerel.starry.blue/inject=true. Implemented with a
# MutatingAdmissionPolicy, so it requires Kubernetes 1.36 or later.
agentInjector:
  enabled: false
  image:
    repository: mackerel/mackerel-container-agent
    tag: v0.13.4-plugins@sha256:46164d96395a600704e1c0ed1f998555314b10c22f98352a43d23521ece0df9b
  # Skip verifying the kubelet serving certificate. Most kubelet certificates
  # are not issued for the node IP the agent connects to.
  kubeletInsecureTLS: true
  resources:
    limits:
      memory: 128Mi
  # Applied to the injected container. The defaults satisfy the restricted Pod
  # Security Standard. The image has no USER, so runAsUser must be numeric.
  # /var/tmp is an injected emptyDir, so the root filesystem can be read-only.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # Restricts injection to matching namespaces in addition to the Pod label.
  namespaceSelector: {}
